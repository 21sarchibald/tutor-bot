<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>

<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Subheading -->
    <h2>About This Page</h2>

    <!-- Paragraph with bold and italic text -->
    <p>This is a simple paragraph of text. HTML allows you to make text <strong>bold</strong> or <em>italicized</em>
        easily.</p>

    <!-- Hyperlink -->
    <p>You can find more tutorials on the <a href="https://www.w3schools.com" target="_blank">W3Schools website</a>.</p>

    <!-- Image placeholder -->
    <h2>Sample Image</h2>
    <img src="https://placeholder.com" alt="Placeholder Image" width="150" height="150">

    <!-- Unordered List -->
    <h2>My Favorite Things</h2>
    <ul>
        <li>Coding web pages</li>
        <li>Learning new frameworks</li>
        <li>Designing interfaces</li>
    </ul>

</body>

</html>
