<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Bot</title>
    <script src="script.js" defer></script>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <wrapper id="page">
        <div id="top">
            <button id="sidebarBtn"><img src="images/swee_logo.png" class="logo"></button>
            <h1>Tutor Bot</h1>
        </div>

        <div id="sidebar" hidden>
            <img src="images/swee_logo.png" class="logo">
            <button class="close">X</button>
            <a href="#">About Us</a>
            <a href="#">New Chat</a>
            <a href="#">Search Chat</a>

            <div id="chat-history">
                <p><b>Chat History</b></p>
            </div>
        </div>

        <section id="chatRoom">
        </section>

        <div id="userinput">
            <div id="bar">
                <input type="text" id="userPrompt" name="userPrompt" placeholder="Ask Tutor Bot!" autocomplete="off">
            </div>
            <div class="buttons">
                <button id="fileupload"><b>十</b></button>
                <button id="submit"><b>↥</b></button>
            </div>
        </div>
    </wrapper>
</body>
</html>
